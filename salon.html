<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aura Studio — Voice Booking</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #14141d;
    --panel-2: #1c1c28;
    --line: #2a2a3a;
    --text: #e8e8f0;
    --muted: #8a8aa0;
    --accent: #a78bfa;
    --accent-2: #f472b6;
    --green: #34d399;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #1a1530 0%, var(--bg) 55%);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    height: 100vh; overflow: hidden;
  }
  .app { display: flex; flex-direction: column; align-items: center; height: 100vh; }

  .pane {
    width: 100%; max-width: 480px; height: 100vh;
    display: flex; flex-direction: column; padding: 32px 24px;
  }
  .brand { display: flex; align-items: center; gap: 12px; justify-content: center; }
  .brand .dot {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-size: 18px;
  }
  .brand h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .brand .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .orb-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 26px 0 16px; }
  .orb {
    width: 104px; height: 104px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2a2a3a, #14141d);
    border: 1px solid var(--line);
    display: grid; place-items: center; position: relative;
    transition: box-shadow .3s, border-color .3s;
  }
  .orb::after {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid transparent; transition: border-color .3s;
  }
  .orb .glyph { font-size: 36px; }
  body[data-state="listening"] .orb { border-color: var(--accent); box-shadow: 0 0 50px -8px var(--accent); }
  body[data-state="listening"] .orb::after { border-color: var(--accent); animation: ring 1.4s ease-out infinite; }
  body[data-state="speaking"] .orb { border-color: var(--green); box-shadow: 0 0 50px -8px var(--green); }
  body[data-state="thinking"] .orb { border-color: var(--accent-2); box-shadow: 0 0 40px -10px var(--accent-2); }
  @keyframes ring { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.35); opacity: 0; } }
  .status { font-size: 13px; color: var(--muted); letter-spacing: .3px; min-height: 18px; }

  .start-btn {
    width: 100%; padding: 13px; border: none; border-radius: 12px; cursor: pointer;
    font-size: 15px; font-weight: 600; color: #0a0a0f;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    transition: opacity .2s, transform .1s;
  }
  .start-btn:hover { opacity: .92; }
  .start-btn:active { transform: scale(.99); }
  .start-btn.end { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  .start-btn:disabled { opacity: .5; cursor: default; }

  .transcript {
    flex: 1; overflow: auto; margin-top: 18px; display: flex; flex-direction: column; gap: 10px;
    padding-top: 14px; border-top: 1px solid var(--line);
  }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; font-size: 14px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #0a0a0f; border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.partial { opacity: .55; }
  .msg.interrupted { opacity: .6; font-style: italic; }

  /* Tool-call marker in the feed */
  .tool {
    align-self: stretch; border: 1px dashed var(--line); border-radius: 10px;
    padding: 8px 11px; font-size: 12.5px; color: var(--accent);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #14141d80;
  }
  .tool .name { font-weight: 600; }
  .tool .args { color: var(--muted); }
  .tool .result { display: block; margin-top: 4px; color: var(--green); white-space: pre-wrap; }
  .tool.pending .result::after { content: "…"; color: var(--muted); }

  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: auto 0; padding: 24px; }
  .err { color: #fca5a5; font-size: 13px; margin-top: 10px; }
</style>
</head>
<body data-state="idle">
  <div class="app">
    <main class="pane">
      <div class="brand">
        <div class="dot">✦</div>
        <div>
          <h1>Aura Studio</h1>
          <div class="sub">Voice booking · AssemblyAI Voice Agent API</div>
        </div>
      </div>

      <div class="orb-wrap">
        <div class="orb"><span class="glyph" id="glyph">🎙️</span></div>
        <div class="status" id="status">Tap start, then just talk</div>
      </div>
      <button class="start-btn" id="startBtn">Start conversation</button>

      <div class="transcript" id="transcript">
        <div class="hint">Try: “What's open on Friday?” then “Book me a haircut at 2pm, my name's Alex.”</div>
      </div>
      <div class="err" id="err"></div>
    </main>
  </div>

<script>
const AAI_WS = "wss://agents.assemblyai.com/v1/ws";
const TARGET_RATE = 24000;
const VOICE = "david";

const $ = (id) => document.getElementById(id);
const setState = (s) => { document.body.dataset.state = s; };
const setStatus = (t) => { $("status").textContent = t; };
const setGlyph = (g) => { $("glyph").textContent = g; };

// ── The "calendar" (entirely mock — nothing real behind it) ──────────
const SERVICES = ["haircut", "color", "styling", "consultation"];
const OPEN_TIMES = ["9:30 AM", "10:00 AM", "11:30 AM", "1:00 PM", "2:30 PM", "4:00 PM", "5:00 PM"];

// Next 7 days, computed in the browser — used for the prompt + valid tool dates.
const weekData = (() => {
  const days = [];
  const today = new Date();
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    days.push({
      iso,
      weekday: d.toLocaleDateString("en-US", { weekday: "long" }),
      label: d.toLocaleDateString("en-US", { month: "short", day: "numeric" }),
      closed: d.getDay() === 0, // Sundays closed, for a little realism
    });
  }
  return days;
})();

// Deterministic-ish mock: pick a few open times for a given date.
function mockAvailability(iso) {
  const day = weekData.find((d) => d.iso === iso);
  if (day && day.closed) return { date: iso, closed: true, message: "We're closed that day." };
  // Rotate the offered window by date so different days look different.
  const seed = iso ? iso.split("-").reduce((a, p) => a + Number(p), 0) : 0;
  const start = seed % 3;
  const open = OPEN_TIMES.slice(start, start + 3);
  return {
    date: iso,
    weekday: day ? day.weekday : "",
    available_times: open,
    message: `${open.length} openings.`,
  };
}

function mockBooking(args) {
  const conf = "AUR-" + (1000 + Math.floor(Math.random() * 9000));
  return {
    ok: true,
    confirmation: conf,
    date: args.date,
    time: args.time,
    service: args.service,
    name: args.client_name,
  };
}

function runTool(name, args) {
  if (name === "get_availability") return mockAvailability(args.date);
  if (name === "book_appointment") return mockBooking(args);
  return { error: "unknown tool" };
}

// ── Agent config (sent inline over the WebSocket) ────────────────────
function toolDefs() {
  const validDates = weekData.map((d) => `${d.weekday} = ${d.iso}`).join(", ");
  return [
    {
      type: "function",
      name: "get_availability",
      description: "Get open appointment times for one day. Call this whenever the caller asks what's available or names a day. Returns a list of free time slots like '2:30 PM'.",
      parameters: {
        type: "object",
        properties: {
          date: { type: "string", description: `The day to check as YYYY-MM-DD. Valid days: ${validDates}` },
        },
        required: ["date"],
      },
    },
    {
      type: "function",
      name: "book_appointment",
      description: "Book an appointment once you have the day, time, service, and the caller's name. Confirm the details out loud before calling. Returns a confirmation number.",
      parameters: {
        type: "object",
        properties: {
          date: { type: "string", description: "Appointment day as YYYY-MM-DD." },
          time: { type: "string", description: "Start time like '2:30 PM'." },
          client_name: { type: "string", description: "The caller's first name." },
          service: { type: "string", enum: SERVICES, description: "Service requested." },
        },
        required: ["date", "time", "client_name", "service"],
      },
    },
  ];
}

function systemPrompt() {
  const today = weekData[0];
  const dayList = weekData.map((d) => `  ${d.weekday}, ${d.label} → ${d.iso}${d.closed ? " (closed)" : ""}`).join("\n");
  return `You are David, the front-desk receptionist at Aura Studio, a hair salon. You book appointments over the phone.

Today is ${today.weekday}, ${today.label} (${today.iso}). The schedule for the week:
${dayList}

How you talk:
- You are a real person, not an AI. Never break character.
- Keep it to one or two short sentences. This is a phone call.
- Warm, upbeat, efficient. Use light filler naturally ("sure", "one sec", "let me check").
- Never say "Certainly" or "Absolutely". Never list more than three times at once.

Your job:
- Figure out which day they want, then call get_availability for that day. When you say a weekday, map it to the dates above.
- Offer two or three open times, not the whole list.
- Collect the service (haircut, color, styling, or consultation) and their first name before booking.
- When you have day, time, service, and name, confirm it back in one sentence, then call book_appointment.
- After booking, read the confirmation number back slowly, digit by digit.
- Never announce that you're using a tool. Just say something like "let me check" and then give the answer.
- If a day is closed, say so and offer the nearest open day.`;
}

// ── Audio worklets (inline via Blob URLs) ────────────────────────────
const captureCode = `
class CaptureProcessor extends AudioWorkletProcessor {
  constructor(opts) {
    super();
    this.target = (opts.processorOptions && opts.processorOptions.targetRate) || 24000;
    this.ratio = sampleRate / this.target;   // input samples per output sample
    this.inBuf = new Float32Array(0);
    this.readIdx = 0;
    this.out = [];
    this.BATCH = 1200; // 50ms @ 24kHz
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    const merged = new Float32Array(this.inBuf.length + ch.length);
    merged.set(this.inBuf); merged.set(ch, this.inBuf.length);
    this.inBuf = merged;
    while (this.readIdx + 1 < this.inBuf.length) {
      const i = Math.floor(this.readIdx);
      const frac = this.readIdx - i;
      this.out.push(this.inBuf[i] * (1 - frac) + this.inBuf[i + 1] * frac);
      this.readIdx += this.ratio;
      if (this.out.length >= this.BATCH) {
        const pcm = new Int16Array(this.BATCH);
        for (let k = 0; k < this.BATCH; k++) {
          const v = Math.max(-1, Math.min(1, this.out[k]));
          pcm[k] = v < 0 ? v * 32768 : v * 32767;
        }
        this.port.postMessage(pcm.buffer, [pcm.buffer]);
        this.out = this.out.slice(this.BATCH);
      }
    }
    const consumed = Math.floor(this.readIdx);
    if (consumed > 0) { this.inBuf = this.inBuf.subarray(consumed); this.readIdx -= consumed; }
    return true;
  }
}
registerProcessor("capture-processor", CaptureProcessor);
`;

const playbackCode = `
class PlaybackProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ring = new Float32Array(sampleRate * 12);
    this.w = 0; this.r = 0;
    this.port.onmessage = (e) => {
      if (e.data === "clear") { this.w = 0; this.r = 0; return; }
      const s = e.data;
      for (let i = 0; i < s.length; i++) { this.ring[this.w % this.ring.length] = s[i]; this.w++; }
    };
  }
  process(inputs, outputs) {
    const o = outputs[0] && outputs[0][0];
    if (!o) return true;
    for (let i = 0; i < o.length; i++) {
      if (this.r < this.w) { o[i] = this.ring[this.r % this.ring.length]; this.r++; }
      else { o[i] = 0; }
    }
    return true;
  }
}
registerProcessor("playback-processor", PlaybackProcessor);
`;

function resample(float32, fromRate, toRate) {
  if (fromRate === toRate) return float32;
  const ratio = fromRate / toRate;
  const outLen = Math.floor(float32.length / ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const idx = i * ratio, j = Math.floor(idx), frac = idx - j;
    out[i] = (float32[j] || 0) * (1 - frac) + (float32[j + 1] || 0) * frac;
  }
  return out;
}

// ── Session lifecycle ────────────────────────────────────────────────
let ws, audioCtx, stream, captureNode, playbackNode, ctxRate;
let ready = false, running = false;
let partialEl = null;

// Tool results must be sent only when `reply.done` is the latest event the
// server sent us (i.e. after the agent's "let me check" transition phrase).
// We buffer completed results and drain them in the reply.done handler.
let pendingResults = [];    // [{ call_id, result }] — done, not yet sent
let canSendResults = false; // true only while reply.done is the latest event

async function start() {
  $("err").textContent = "";
  setState("connecting"); setStatus("Connecting…"); setGlyph("⏳");
  $("startBtn").disabled = true;

  // 1. Mint a fresh single-use token on our server (API key stays server-side)
  let token;
  try {
    const r = await fetch("/api/voice-token");
    if (!r.ok) throw new Error(await r.text());
    token = (await r.json()).token;
  } catch (e) {
    fail("Could not get token: " + e.message); return;
  }

  // 2. Mic + audio graph
  try {
    audioCtx = new AudioContext({ sampleRate: TARGET_RATE });
    await audioCtx.resume();
    ctxRate = audioCtx.sampleRate; // Safari may ignore 24k and use hardware rate

    const capBlob = URL.createObjectURL(new Blob([captureCode], { type: "application/javascript" }));
    const playBlob = URL.createObjectURL(new Blob([playbackCode], { type: "application/javascript" }));
    await audioCtx.audioWorklet.addModule(capBlob);
    await audioCtx.audioWorklet.addModule(playBlob);

    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: true },
    });
    const src = audioCtx.createMediaStreamSource(stream);
    captureNode = new AudioWorkletNode(audioCtx, "capture-processor", {
      processorOptions: { targetRate: TARGET_RATE },
    });
    src.connect(captureNode); // not connected to destination — don't echo the mic
    playbackNode = new AudioWorkletNode(audioCtx, "playback-processor");
    playbackNode.connect(audioCtx.destination);

    captureNode.port.onmessage = (e) => {
      if (!ready || !ws || ws.readyState !== WebSocket.OPEN) return;
      const bytes = new Uint8Array(e.data);
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      ws.send(JSON.stringify({ type: "input.audio", audio: btoa(bin) }));
    };
  } catch (e) {
    fail("Microphone error: " + e.message); return;
  }

  // 3. Connect directly to the Voice Agent API and configure the agent inline.
  const url = new URL(AAI_WS);
  url.searchParams.set("token", token);
  ws = new WebSocket(url);

  ws.addEventListener("open", () => {
    ws.send(JSON.stringify({
      type: "session.update",
      session: {
        system_prompt: systemPrompt(),
        greeting: "Hi, thanks for calling Aura Studio — this is David. What can I book for you?",
        tools: toolDefs(),
        input: { keyterms: ["Aura Studio", "haircut", "color", "styling", "consultation"] },
        output: { voice: VOICE },
      },
    }));
  });

  ws.addEventListener("message", (ev) => handleEvent(JSON.parse(ev.data)));
  ws.addEventListener("close", () => { if (running) fail("Connection closed."); });
  ws.addEventListener("error", () => fail("WebSocket error."));

  running = true;
  $("startBtn").disabled = false;
  $("startBtn").textContent = "End conversation";
  $("startBtn").classList.add("end");
}

function handleEvent(msg) {
  switch (msg.type) {
    case "session.ready":
      ready = true; setState("listening"); setStatus("Listening…"); setGlyph("👂");
      break;
    case "input.speech.started":
      canSendResults = false; // a new turn began — hold any pending results
      setState("listening"); setStatus("Listening…"); setGlyph("👂");
      playbackNode.port.postMessage("clear"); // snappier barge-in
      break;
    case "input.speech.stopped":
      setState("thinking"); setStatus("Thinking…"); setGlyph("💭");
      break;
    case "transcript.user.delta":
      showPartialUser(msg.text || msg.delta || "");
      break;
    case "transcript.user":
      finalizeUser(msg.text);
      break;
    case "reply.started":
      canSendResults = false; // agent is mid-reply — wait for the next reply.done
      setState("thinking"); setGlyph("💭");
      break;
    case "reply.audio":
      setState("speaking"); setStatus("Speaking…"); setGlyph("🗣️");
      playAudio(msg.data);
      break;
    case "transcript.agent":
      addMsg("agent", msg.text, msg.interrupted);
      break;
    case "reply.done":
      if (msg.status === "interrupted") {
        playbackNode.port.postMessage("clear");
        pendingResults = [];      // discard accumulators from the cut-off reply
        canSendResults = false;
      } else {
        canSendResults = true;    // reply.done is now the latest event — safe to send
        flushResults();
      }
      if (ready) { setState("listening"); setStatus("Listening…"); setGlyph("👂"); }
      break;
    case "tool.call":
      onToolCall(msg);
      break;
    case "session.error":
    case "error":
      fail("Error: " + (msg.error || msg.message || msg.code || "unknown"));
      break;
  }
}

async function onToolCall(msg) {
  const args = msg.arguments || msg.args || {};
  const entry = addToolEntry(msg.name, args);
  let result;
  try { result = runTool(msg.name, args); }
  catch (e) { result = { error: String(e) }; }
  setToolResult(entry, result);
  // Buffer the result. It's sent only once reply.done is the latest event —
  // sending it now (mid transition-phrase) makes the agent ignore it.
  pendingResults.push({ call_id: msg.call_id, result });
  flushResults();
}

// Drain buffered tool results, but only when the server is ready to accept
// them (reply.done was the latest event we received).
function flushResults() {
  if (!canSendResults || !pendingResults.length) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  for (const { call_id, result } of pendingResults) {
    ws.send(JSON.stringify({
      type: "tool.result",
      call_id,
      result: JSON.stringify(result), // result must be a JSON string
    }));
  }
  pendingResults = [];
  canSendResults = false; // sending triggers a new reply; wait for its reply.done
}

function playAudio(b64) {
  const raw = atob(b64);
  const pcm = new Int16Array(raw.length / 2);
  for (let i = 0; i < pcm.length; i++) pcm[i] = raw.charCodeAt(i * 2) | (raw.charCodeAt(i * 2 + 1) << 8);
  let f = new Float32Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 32768;
  if (ctxRate !== TARGET_RATE) f = resample(f, TARGET_RATE, ctxRate);
  playbackNode.port.postMessage(f);
}

// ── Transcript + tool-call UI ────────────────────────────────────────
function clearHint() { const h = $("transcript").querySelector(".hint"); if (h) h.remove(); }

function showPartialUser(text) {
  clearHint();
  if (!partialEl) {
    partialEl = document.createElement("div");
    partialEl.className = "msg user partial";
    $("transcript").appendChild(partialEl);
  }
  partialEl.textContent = text;
  scrollTranscript();
}
function finalizeUser(text) {
  clearHint();
  if (partialEl) { partialEl.textContent = text; partialEl.classList.remove("partial"); partialEl = null; }
  else addMsg("user", text);
}
function addMsg(role, text, interrupted) {
  if (!text) return;
  clearHint();
  const el = document.createElement("div");
  el.className = `msg ${role}` + (interrupted ? " interrupted" : "");
  el.textContent = text;
  $("transcript").appendChild(el);
  scrollTranscript();
}

function addToolEntry(name, args) {
  clearHint();
  const el = document.createElement("div");
  el.className = "tool pending";
  const argStr = Object.entries(args).map(([k, v]) => `${k}: ${v}`).join(", ");
  el.innerHTML = `🔧 <span class="name"></span> <span class="args"></span><span class="result"></span>`;
  el.querySelector(".name").textContent = name;
  el.querySelector(".args").textContent = argStr ? `(${argStr})` : "";
  $("transcript").appendChild(el);
  scrollTranscript();
  return el;
}
function setToolResult(el, result) {
  el.classList.remove("pending");
  el.querySelector(".result").textContent = "→ " + summarizeResult(result);
  scrollTranscript();
}
function summarizeResult(r) {
  if (!r || typeof r !== "object") return String(r);
  if (r.closed) return "closed that day";
  if (Array.isArray(r.available_times)) return r.available_times.join(", ") || "fully booked";
  if (r.ok && r.confirmation) return `booked · ${r.confirmation}`;
  if (r.error) return "error: " + r.error;
  return JSON.stringify(r);
}

function scrollTranscript() { const t = $("transcript"); t.scrollTop = t.scrollHeight; }

function fail(message) {
  $("err").textContent = message;
  setState("idle"); setStatus("Stopped"); setGlyph("🎙️");
  teardown();
  $("startBtn").disabled = false;
  $("startBtn").textContent = "Start conversation";
  $("startBtn").classList.remove("end");
}

function stop() {
  running = false; ready = false;
  teardown();
  setState("idle"); setStatus("Ended — tap start to talk again"); setGlyph("🎙️");
  $("startBtn").textContent = "Start conversation";
  $("startBtn").classList.remove("end");
}

function teardown() {
  try { ws && ws.close(); } catch {}
  try { stream && stream.getTracks().forEach(t => t.stop()); } catch {}
  try { audioCtx && audioCtx.close(); } catch {}
  ws = null; stream = null; audioCtx = null; ready = false;
  pendingResults = []; canSendResults = false;
}

$("startBtn").addEventListener("click", () => { running ? stop() : start(); });
</script>
</body>
</html>
